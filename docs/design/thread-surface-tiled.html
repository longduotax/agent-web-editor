<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi — Tiled Multi-Agent Surface</title>
<style>
  /* ============================================================
     Pi tiled workspace — Codex-style panes, N at a time.
     Panes support Split and Archive. (No collapse/dock — kept simple.)
     Grid reflows to the number of open panes.
     ============================================================ */
  :root, :root[data-theme="light"] {
    --page:#ffffff; --sidebar:#ffffff; --card:#ffffff; --user-pill:#f1f1f2;
    --hover:#f4f4f5; --active:#ececee; --hairline:#e9e9eb; --hairline-2:#e2e2e4;
    --text:#1d1d1f; --text-2:#3a3a3e; --muted:#8a8a8f; --faint:#b3b3b8;
    --green:#2f9e44; --red:#d1453b; --amber:#c07d16; --accent:#2f6feb;
    --send-bg:#1d1d1f; --send-fg:#ffffff;
    --run:#c07d16; --wait:#2f6feb; --done:#2f9e44; --fail:#d1453b;
    --focus-ring:rgba(47,111,235,0.5);
    --card-shadow:0 1px 2px rgba(20,20,30,0.05); --icon-fill:none;
  }
  :root[data-theme="dark"] {
    --page:#131417; --sidebar:#17181c; --card:#1b1d22; --user-pill:#26282e;
    --hover:#1f2127; --active:#24262d; --hairline:rgba(255,255,255,0.08); --hairline-2:rgba(255,255,255,0.12);
    --text:#ececee; --text-2:#c3c5cb; --muted:#8b8d95; --faint:#62646c;
    --green:#4ec06f; --red:#e0645c; --amber:#d6a53a; --accent:#6aa0ff;
    --send-bg:#ececee; --send-fg:#16171a;
    --run:#d6a53a; --wait:#6aa0ff; --done:#4ec06f; --fail:#e0645c;
    --focus-ring:rgba(106,160,255,0.55);
    --card-shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--page); color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px; -webkit-font-smoothing:antialiased; transition:background .2s ease,color .2s ease; }
  :root { --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace; }
  svg { display:block; }
  .ico { width:16px; height:16px; stroke:currentColor; fill:var(--icon-fill); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .ico-sm { width:14px; height:14px; }

  /* dev toolbar */
  .devbar { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:14px;
    padding:8px 16px; background:color-mix(in srgb,var(--page) 85%,transparent); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline); }
  .devbar h1 { margin:0; font-size:14px; font-weight:650; }
  .devbar h1 span { color:var(--muted); font-weight:400; }
  .devbar .right { margin-left:auto; display:flex; gap:14px; align-items:center; }
  .devbar .hint { color:var(--faint); font-size:12.5px; }
  .seg { display:inline-flex; gap:2px; padding:3px; border-radius:10px; background:var(--hover); border:1px solid var(--hairline); }
  .seg button { appearance:none; border:0; cursor:pointer; font:inherit; font-size:12.5px; font-weight:550;
    padding:5px 11px; border-radius:7px; background:transparent; color:var(--muted); }
  .seg button[aria-pressed="true"] { background:var(--card); color:var(--text); box-shadow:var(--card-shadow); }

  /* ---------------- shell ---------------- */
  .app { display:grid; grid-template-columns:236px 1fr; height:calc(100vh - 41px); }
  .app.insp { grid-template-columns:236px 1fr 316px; }
  .side { display:flex; flex-direction:column; min-width:0; background:var(--sidebar); border-right:1px solid var(--hairline); }
  .side-top { display:flex; align-items:center; gap:8px; padding:13px 13px 8px; }
  .side-top .logo { font-size:15px; font-weight:650; display:flex; align-items:center; gap:5px; }
  .side-top .spacer { flex:1; }
  .icon-btn { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; border:0; background:transparent; color:var(--muted); cursor:pointer; }
  .icon-btn:hover { background:var(--hover); color:var(--text); }
  .nav { padding:4px 8px; }
  .nav a { display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:8px; color:var(--text-2); font-size:14px; cursor:pointer; }
  .nav a:hover { background:var(--hover); }
  .nav a .grow { flex:1; }
  .side-scroll { flex:1; overflow:auto; padding:6px 8px; }
  .sec { padding:12px 9px 4px; font-size:12px; color:var(--muted); }
  .chats { margin:0 0 4px; padding:0; list-style:none; }
  .chats li { display:flex; align-items:center; gap:8px; margin:1px 0; padding:6px 9px; border-radius:8px; font-size:13.5px; color:var(--muted); cursor:pointer; }
  .chats li:hover { background:var(--hover); color:var(--text-2); }
  .chats li.active { background:var(--active); color:var(--text); }
  .chats li .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sdot { width:7px; height:7px; border-radius:50%; flex:none; background:var(--faint); }
  .sdot.run { background:var(--run); animation:pulse 1.6s infinite; }
  .sdot.wait { background:var(--wait); }
  .sdot.done { background:var(--done); }
  .sdot.fail { background:var(--fail); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 55%,transparent);} 70%{box-shadow:0 0 0 5px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }
  .side-user { display:flex; align-items:center; gap:9px; padding:10px 12px; border-top:1px solid var(--hairline); }
  .side-user .pfp { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:#e35d4a; color:#fff; font-size:11px; font-weight:700; }
  .side-user .nm { flex:1; font-size:14px; }

  /* ---------------- surface ---------------- */
  .surface { min-width:0; min-height:0; padding:8px; }
  .tiles { height:100%; display:grid; gap:8px; }
  .tiles.l1 { grid-template-columns:1fr; }
  .tiles.l2 { grid-template-columns:1fr 1fr; }
  .tiles.l3 { grid-template-columns:1fr 1fr 1fr; }
  .tiles.l4 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .tiles-empty { height:100%; display:grid; place-items:center; color:var(--faint); font-size:14px; border:1px dashed var(--hairline-2); border-radius:14px; }

  /* ---------------- pane ---------------- */
  .pane { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0;
    background:var(--card); border:1px solid var(--hairline-2); border-radius:14px; overflow:hidden; box-shadow:var(--card-shadow); }
  .pane.focused { border-color:transparent; box-shadow:0 0 0 2px var(--focus-ring), var(--card-shadow); }
  .pane.dim .pane-head .title { color:var(--muted); }
  .pane-head { display:flex; align-items:center; gap:8px; padding:9px 11px; border-bottom:1px solid var(--hairline); }
  .pane-head .status { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:550; flex:none; }
  .pane-head .status .sdot { width:8px; height:8px; }
  .pane-head .status.run { color:var(--run); } .pane-head .status.wait { color:var(--wait); }
  .pane-head .status.done { color:var(--done); } .pane-head .status.fail { color:var(--fail); }
  .pane-head .title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; font-weight:600; }
  .pane-head .repo { flex:none; font-size:11.5px; color:var(--muted); background:var(--hover); padding:2px 7px; border-radius:999px; }
  .pane-head .acts { display:flex; gap:1px; flex:none; }
  .pane-head .acts .icon-btn { width:25px; height:25px; }
  .pane-head .acts .icon-btn.danger:hover { color:var(--red); }

  .pane-scroll { flex:1; min-height:0; overflow:auto; padding:14px 16px; }
  .pane-composer { flex:none; padding:8px 10px 10px; border-top:1px solid var(--hairline); }
  .cbox { display:flex; align-items:center; gap:6px; border:1px solid var(--hairline-2); border-radius:14px; background:var(--card); padding:4px 4px 4px 12px; }
  .cbox:focus-within { border-color:color-mix(in srgb,var(--accent) 45%,var(--hairline-2)); }
  .cbox input { flex:1; border:0; background:transparent; color:var(--text); font:inherit; font-size:13.5px; padding:6px 0; outline:none; }
  .cbox input::placeholder { color:var(--faint); }
  .cbox .send { width:26px; height:26px; flex:none; border-radius:50%; border:0; background:var(--send-bg); color:var(--send-fg); cursor:pointer; display:grid; place-items:center; }

  /* transcript bits */
  .u-row { display:flex; justify-content:flex-end; margin:14px 0; }
  .u-bubble { max-width:85%; padding:8px 12px; border-radius:15px; background:var(--user-pill); font-size:14px; line-height:1.45; }
  .worked { display:inline-flex; align-items:center; gap:6px; margin:4px 0 10px; color:var(--muted); font-size:13px; cursor:pointer; }
  .a-block { font-size:14px; line-height:1.58; }
  .a-block p { margin:0 0 11px; }
  .a-block strong { font-weight:640; }
  .a-block ul { margin:2px 0 11px; padding-left:20px; }
  .a-block li { margin:5px 0; }
  .a-block code { font-family:var(--mono); font-size:12.5px; background:var(--hover); padding:1px 5px; border-radius:5px; }
  .caret { display:inline-block; width:7px; height:15px; vertical-align:-3px; background:var(--text); margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0;} }
  .card { margin:10px 0; border:1px solid var(--hairline-2); border-radius:11px; background:var(--card); overflow:hidden; }
  .card-head { display:flex; align-items:center; gap:9px; padding:9px 11px; }
  .card-head .ci { width:24px; height:24px; flex:none; border-radius:7px; display:grid; place-items:center; background:var(--hover); color:var(--text-2); }
  .card-head .ct { flex:1; min-width:0; }
  .card-head .tt { font-size:13px; font-weight:550; }
  .card-head .cs { font-size:12px; margin-top:1px; }
  .card-head .spin { width:14px; height:14px; border:2px solid var(--hairline-2); border-top-color:var(--run); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }
  .rows { border-top:1px solid var(--hairline); }
  .frow { display:flex; align-items:center; gap:8px; padding:7px 11px; font-size:12.5px; }
  .frow + .frow { border-top:1px solid var(--hairline); }
  .frow code { flex:1; min-width:0; font-family:var(--mono); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frow .ok { flex:none; color:var(--green); }
  .approve { margin:12px 0; border:1px solid color-mix(in srgb,var(--wait) 45%,var(--hairline-2)); border-radius:12px;
    background:color-mix(in srgb,var(--wait) 6%,var(--card)); overflow:hidden; }
  .approve .ah { padding:11px 13px; font-size:13.5px; }
  .approve .ah b { font-weight:640; }
  .approve .cmd { margin:0 13px; padding:8px 10px; border-radius:8px; background:var(--page); border:1px solid var(--hairline);
    font-family:var(--mono); font-size:12px; overflow:auto; white-space:pre; }
  .approve .abtns { display:flex; gap:8px; padding:12px 13px; }
  .approve .abtns button { padding:7px 14px; border-radius:8px; font:inherit; font-size:13px; font-weight:550; cursor:pointer; }
  .approve .approve-btn { border:0; background:var(--accent); color:#fff; }
  .approve .reject-btn { border:1px solid var(--hairline-2); background:var(--card); color:var(--text); }
  .fail-note { margin:12px 0; padding:11px 13px; border:1px solid color-mix(in srgb,var(--fail) 40%,var(--hairline-2));
    border-radius:11px; background:color-mix(in srgb,var(--fail) 6%,var(--card)); font-size:13.5px; color:var(--text); }
  .fail-note b { color:var(--fail); }

  /* ---------------- inspector / environment (right panel) ---------------- */
  .inspector { display:flex; flex-direction:column; min-width:0; background:var(--sidebar); border-left:1px solid var(--hairline); }
  .app:not(.insp) .inspector { display:none; }
  .insp-head { display:flex; align-items:center; gap:8px; padding:12px 13px 8px; }
  .insp-head .t { flex:1; font-size:14px; font-weight:600; }
  .insp-focus { margin:0 8px 6px; padding:9px 11px; border:1px solid var(--hairline); border-radius:10px; background:var(--card); }
  .insp-focus .fr { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; }
  .insp-focus .fr .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .insp-focus .fs { margin-top:3px; font-size:12px; color:var(--muted); }
  .insp-body { flex:1; overflow:auto; padding:4px 8px 10px; }
  .insp-sec { padding:12px 6px 4px; font-size:12px; color:var(--muted); display:flex; align-items:center; }
  .insp-sec .grow { flex:1; }
  .insp-row { display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:9px; font-size:13.5px; cursor:pointer; }
  .insp-row:hover { background:var(--hover); }
  .insp-row .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .insp-row.muted { color:var(--faint); cursor:default; } .insp-row.muted:hover { background:transparent; }
  .insp-row .chev { color:var(--muted); }
  .insp-row .add { color:var(--green); } .insp-row .del { color:var(--red); }
  .insp-sep { height:1px; background:var(--hairline); margin:6px 6px; }
  .reopen { position:fixed; top:49px; right:14px; z-index:40; }
</style>
</head>
<body>
  <div class="devbar">
    <h1>Pi tiled workspace <span>· multi-agent monitoring</span></h1>
    <div class="seg" id="layoutSeg" role="group" aria-label="Layout">
      <button data-l="1">1</button>
      <button data-l="2" aria-pressed="true">2-up</button>
      <button data-l="3">3-up</button>
      <button data-l="4">2×2</button>
    </div>
    <div class="right">
      <span class="hint" id="hint"></span>
      <button class="icon-btn" id="inspToggle" title="Toggle right panel"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
      <div class="seg" role="group" aria-label="Theme">
        <button data-theme-set="light" aria-pressed="true">☀</button>
        <button data-theme-set="dark">☾</button>
      </div>
    </div>
  </div>

  <div class="app insp">
    <aside class="side">
      <div class="side-top">
        <span class="logo">π Pi</span><span class="spacer"></span>
        <button class="icon-btn"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
        <button class="icon-btn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <nav class="nav">
        <a><svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span class="grow">New thread</span></a>
      </nav>
      <div class="side-scroll">
        <div class="sec">valai · open runs</div>
        <ul class="chats" id="sideRuns"></ul>
      </div>
      <div class="side-user"><span class="pfp">BU</span><span class="nm">buster</span></div>
    </aside>

    <section class="surface">
      <div class="tiles l2" id="tiles"></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </div>

<script>
  const chev = `<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;
  const ok = `<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>`;
  const sendIco = `<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>`;
  const splitIco = `<svg class="ico ico-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg>`;
  const archiveIco = `<svg class="ico ico-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8"/><path d="M10 12h4"/></svg>`;

  const statusText = { run:'Working', wait:'Needs approval', done:'Done', fail:'Failed' };
  const cmdRows = (cmds) => cmds.map(c=>`<div class="frow"><code>$ ${c}</code><span class="ok">${ok}</span></div>`).join("");

  const BODIES = {
    a: `
      <div class="u-row"><div class="u-bubble">approve both, then rerun 13768</div></div>
      <div class="worked">Working · 2m 14s ${chev}</div>
      <div class="card">
        <div class="card-head"><div class="ci"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg></div>
          <div class="ct"><div class="tt">Running commands</div><div class="cs" style="color:var(--run)">pytest tests/avm/…</div></div>
          <div class="spin"></div></div>
        <div class="rows">${cmdRows(["git stack apply pr-674","pnpm test avm/parity"])}</div>
      </div>
      <div class="a-block"><p>Extracted the road-damping fix into PR #674 and restacked. Re-running report 13768 against the protected corpus now<span class="caret"></span></p></div>`,
    b: `
      <div class="u-row"><div class="u-bubble">in a worktree, fix the merge conflict</div></div>
      <div class="worked">Worked for 3m 08s ${chev}</div>
      <div class="a-block"><p>The conflict is in <code>layoutTree.ts</code>. I can take theirs for the split logic and keep our focus handling. This runs a destructive checkout:</p></div>
      <div class="approve">
        <div class="ah"><b>Approve command?</b> · resolve conflict + stage</div>
        <div class="cmd">git checkout --theirs src/.../layoutTree.ts
git add -A && git commit --no-edit</div>
        <div class="abtns"><button class="approve-btn">Approve</button><button class="reject-btn">Reject</button></div>
      </div>`,
    c: `
      <div class="u-row"><div class="u-bubble">how many lines of code does this repo have</div></div>
      <div class="worked">Worked for 14s ${chev}</div>
      <div class="a-block">
        <p>Approximately <strong>367,471 lines</strong> across <strong>1,424 files</strong>.</p>
        <ul><li>Python: 223,388</li><li>TSX: 76,035</li><li>TypeScript: 38,939</li><li>HTML: 26,479</li></ul>
        <p>Excludes docs, config, and binaries.</p>
      </div>`,
    d: `
      <div class="u-row"><div class="u-bubble">migrate layoutStorage to v2 schema</div></div>
      <div class="worked">Worked for 1m 52s ${chev}</div>
      <div class="a-block"><p>Ran the migration and the transform step, but the verification suite did not pass:</p></div>
      <div class="fail-note"><b>3 tests failed</b> — <code>layoutStorage.test.ts</code>: expected v2 tree, received undefined for archived threads. Nothing was written to disk.</div>
      <div class="a-block"><p>I can add a fallback for archived threads and retry — want me to?</p></div>`,
  };

  const RUNS = {
    a:{ state:'run',  title:'Sequence AVM PR job merge', repo:'valai', time:'2m 14s', ph:'Reply to this run…',       branch:'agent/avm-pr-merge',   add:156, del:530 },
    b:{ state:'wait', title:'fix the merge conflict',      repo:'valai', ph:'Approve, reject, or reply…', branch:'fix/merge-conflict',   add:12,  del:8   },
    c:{ state:'done', title:'perf audit of composer',      repo:'valai', ph:'Ask a follow-up…',          branch:'perf/composer-audit',  add:0,   del:0   },
    d:{ state:'fail', title:'migrate layout storage',      repo:'valai', ph:'Retry or redirect…',        branch:'chore/layout-storage-v2', add:88, del:40 },
  };
  const ORDER = ['a','b','c','d'];

  const HINTS = {
    1:'One run, full width — same calm Codex reading column.',
    2:'Two runs side by side — a live run and one that needs approval.',
    3:'Three runs — glance the headers: amber = working, blue = needs you, green = done.',
    4:'2×2 — monitor four runs; the blue "Needs approval" pane is where your attention goes.',
  };

  let open = ['a','b'];       // currently tiled panes
  let archived = [];

  const colClass = n => ['','l1','l2','l3','l4'][Math.min(n,4)] || 'l4';

  function paneHTML(key){
    const p = RUNS[key];
    const focused = key === open[0];
    return `<div class="pane ${focused?'focused':'dim'}" data-k="${key}">
      <div class="pane-head">
        <span class="status ${p.state}"><span class="sdot ${p.state}"></span>${statusText[p.state]}${p.time?` · ${p.time}`:''}</span>
        <span class="title">${p.title}</span>
        <span class="repo">△ ${p.repo}</span>
        <span class="acts">
          <button class="icon-btn" data-act="split" title="Split">${splitIco}</button>
          <button class="icon-btn danger" data-act="archive" title="Archive">${archiveIco}</button>
        </span>
      </div>
      <div class="pane-scroll">${BODIES[key]}</div>
      <div class="pane-composer"><div class="cbox"><input placeholder="${p.ph}"><button class="send">${sendIco}</button></div></div>
    </div>`;
  }

  function sideHTML(){
    return open.map(key=>{
      const p = RUNS[key];
      return `<li class="${key===open[0]?'active':''}" data-k="${key}"><span class="sdot ${p.state}"></span><span class="t">${p.title}</span></li>`;
    }).join("");
  }

  const gitIco = `<svg class="ico" viewBox="0 0 24 24"><path d="M9 19c-4 1.5-4-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 00-1.3-3.2 4.3 4.3 0 00-.1-3.2s-1-.3-3.5 1.3a12 12 0 00-6.3 0C6.5 2.8 5.5 3.1 5.5 3.1a4.3 4.3 0 00-.1 3.2A4.6 4.6 0 004 9.5c0 4.6 2.7 5.7 5.5 6-.4.4-.6 1-.5 1.6V21"/></svg>`;
  const gearIco = `<svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 000-2l2-1.5-2-3.4-2.3 1a7.9 7.9 0 00-1.7-1L15 3H9.9l-.4 2.6a7.9 7.9 0 00-1.7 1l-2.3-1-2 3.4L5.5 11a7.9 7.9 0 000 2l-2 1.5 2 3.4 2.3-1a7.9 7.9 0 001.7 1l.4 2.6H15l.4-2.6a7.9 7.9 0 001.7-1l2.3 1 2-3.4z"/></svg>`;
  const branchIco = `<svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6"/><path d="M18 7v2a4 4 0 01-4 4H6"/><circle cx="18" cy="6" r="1.4"/></svg>`;
  const worktreeIco = `<svg class="ico" viewBox="0 0 24 24"><path d="M6 3v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9a9 9 0 01-9 9"/></svg>`;

  function inspectorHTML(){
    const key = open[0];
    if(!key) return `<div class="insp-head"><span class="t">Environment</span></div><div class="insp-body"><div class="insp-row muted"><span class="grow">No focused run</span></div></div>`;
    const p = RUNS[key];
    const changes = (p.add||p.del) ? `<span class="add">+${p.add}</span> <span class="del">-${p.del}</span>` : `<span style="color:var(--muted)">clean</span>`;
    return `
      <div class="insp-head"><span class="t">Environment</span><button class="icon-btn">${gearIco}</button><button class="icon-btn" id="inspClose"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="insp-focus">
        <div class="fr"><span class="sdot ${p.state}"></span><span class="title">${p.title}</span></div>
        <div class="fs">${statusText[p.state]}${p.time?` · ${p.time}`:''} · focused pane</div>
      </div>
      <div class="insp-body">
        <div class="insp-row"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 4v16"/></svg><span class="grow">Changes</span>${changes}</div>
        <div class="insp-row">${worktreeIco}<span class="grow">Worktree</span><span class="chev">${chev}</span></div>
        <div class="insp-row">${branchIco}<span class="grow">${p.branch}</span><span class="chev">${chev}</span></div>
        <div class="insp-row muted"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/></svg><span class="grow">Commit or push</span></div>
        <div class="insp-sep"></div>
        <div class="insp-sec"><span class="grow">Sources</span><button class="icon-btn"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="insp-row">${gitIco}<span class="grow">GitHub</span></div>
        <div class="insp-row muted"><span class="grow" style="padding-left:26px">View all</span></div>
      </div>`;
  }

  function render(){
    const tiles = document.getElementById('tiles');
    tiles.className = 'tiles ' + colClass(open.length);
    tiles.innerHTML = open.length ? open.map(paneHTML).join("")
      : `<div class="tiles-empty">No open runs — start a new thread to fill the surface.</div>`;
    document.getElementById('sideRuns').innerHTML = sideHTML();
    document.getElementById('inspector').innerHTML = inspectorHTML();
    document.getElementById('hint').textContent = HINTS[Math.min(open.length,4)] || '';
    document.querySelectorAll('#layoutSeg button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.l)===open.length)));
  }

  function setLayout(n){ open = ORDER.filter(k=>!archived.includes(k)).slice(0, n); render(); }
  function archive(key){ open = open.filter(k=>k!==key); archived.push(key); render(); }

  const appEl = document.querySelector('.app');
  function toggleInspector(){ appEl.classList.toggle('insp'); }

  document.addEventListener('click', (e)=>{
    if(e.target.closest('#inspToggle') || e.target.closest('#inspClose')){ toggleInspector(); return; }
    const li = e.target.closest('#sideRuns li');
    if(li){ open = [li.dataset.k, ...open.filter(k=>k!==li.dataset.k)]; render(); return; }
    const btn = e.target.closest('.pane-head .icon-btn[data-act]');
    if(btn){
      const key = btn.closest('.pane').dataset.k;
      if(btn.dataset.act==='archive') archive(key);
      // 'split' is a visual stub in this mock
      return;
    }
    const seg = e.target.closest('#layoutSeg button');
    if(seg){ archived = []; setLayout(Number(seg.dataset.l)); return; }
    // clicking an unfocused pane focuses it (updates the inspector);
    // ignore clicks on inputs/buttons so the composer keeps focus
    if(e.target.closest('input, button')) return;
    const pane = e.target.closest('.pane');
    if(pane && pane.dataset.k && pane.dataset.k !== open[0]){
      open = [pane.dataset.k, ...open.filter(k=>k!==pane.dataset.k)]; render();
    }
  });

  const root = document.documentElement;
  document.querySelectorAll('[data-theme-set]').forEach(btn => btn.addEventListener('click', ()=>{
    const t = btn.dataset.themeSet; root.setAttribute('data-theme', t);
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet===t)));
  }));

  render();
</script>
</body>
</html>
