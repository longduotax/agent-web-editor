<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local coding-agent workspace" />
    <title>Pi Web Workspace</title>
    <script>
      try {
        var v = JSON.parse(
          localStorage.getItem("pi-workspace:theme") || "null",
        );
        if (v && (v.choice === "light" || v.choice === "dark"))
          document.documentElement.setAttribute("data-theme", v.choice);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
